[extension]
name = "native3d"
version = "0.2.0"
abi = 1
module = "module.mlpl"
native_namespace = "_native3d"

[[native]]
target = "aarch64-apple-darwin"
library = "native/aarch64-apple-darwin/libmlpl_extension_native3d.dylib"

[[native]]
target = "x86_64-apple-darwin"
library = "native/x86_64-apple-darwin/libmlpl_extension_native3d.dylib"

[[native]]
target = "aarch64-unknown-linux-gnu"
library = "native/aarch64-unknown-linux-gnu/libmlpl_extension_native3d.so"

[[native]]
target = "x86_64-unknown-linux-gnu"
library = "native/x86_64-unknown-linux-gnu/libmlpl_extension_native3d.so"
