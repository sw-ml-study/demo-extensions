[package]
name = "mlpl-extension-hello"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mlpl-extension-abi = { path = "../../crates/mlpl-extension-abi" }
mlpl-extension-sdk = { path = "../../crates/mlpl-extension-sdk" }

[lints.rust]
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
