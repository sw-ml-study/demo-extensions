[workspace]
members = [
    "crates/mlpl-extension-abi",
    "crates/mlpl-extension-loader",
    "crates/mlpl-extension-sdk",
    "extensions/hello",
]
resolver = "2"
exclude = ["tests/upstream-host"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
