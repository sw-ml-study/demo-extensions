[workspace]
members = [
    "crates/mlpl-extension-abi",
    "crates/mlpl-extension-loader",
    "crates/mlpl-extension-sdk",
    "crates/mlpl-http-contract",
    "crates/mlpl-native3d-scene",
    "crates/mlpl-native3d-window",
    "crates/mlpl-microscope-model",
    "crates/mlpl-microscope-web",
    "extensions/hello",
    "extensions/http-client",
    "extensions/http-server",
    "extensions/sqlite",
    "extensions/boundary-probe",
    "extensions/canvas",
    "extensions/native3d",
]
resolver = "2"
exclude = ["tests/upstream-host"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
